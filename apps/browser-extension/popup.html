<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 340px;
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0a0e1a;
        color: #e2e8f0;
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid #212b45;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: #3b82f620;
        color: #60a5fa;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 12px;
      }
      .title {
        font-weight: 700;
        font-size: 13px;
      }
      .sub {
        font-size: 10px;
        color: #7c89a8;
      }
      main {
        padding: 14px;
      }
      input,
      button {
        font-family: inherit;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #0f1524;
        border: 1px solid #212b45;
        border-radius: 8px;
        padding: 8px 10px;
        color: #e2e8f0;
        font-size: 13px;
        outline: none;
      }
      button {
        width: 100%;
        margin-top: 10px;
        background: #3b82f6;
        border: 0;
        border-radius: 8px;
        padding: 9px;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      .out {
        margin-top: 12px;
        font-size: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid #212b4560;
      }
      .k {
        color: #7c89a8;
      }
      .badge {
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 700;
      }
      .allow {
        background: #10b98120;
        color: #10b981;
      }
      .confirm {
        background: #f59e0b20;
        color: #f59e0b;
      }
      .block {
        background: #ef444420;
        color: #ef4444;
      }
      pre {
        background: #0f1524;
        border: 1px solid #212b45;
        border-radius: 8px;
        padding: 8px;
        font-size: 10px;
        color: #22d3ee;
        overflow: auto;
        max-height: 120px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">P</div>
      <div>
        <div class="title">PVCC Agent</div>
        <div class="sub">On-device privacy · SIH26171</div>
      </div>
    </header>
    <main>
      <input id="task" placeholder="e.g. Find my order status" value="Find my order status" />
      <button id="run">Run on this page</button>
      <div class="out" id="out"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
